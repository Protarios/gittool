[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protarios-gittool"
version = "0.3.0"
description = "Windows-ready PySide6/Qt6 gittyup GUI for safe Git repository pulls"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gittyup>=1.2.0,<2",
    "platformdirs>=4.5",
    "PySide6_Essentials>=6.10,<7",
]

[project.gui-scripts]
gittool = "gittool.app:main"

[tool.setuptools.packages.find]
include = ["gittool*"]
