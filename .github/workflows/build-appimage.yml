name: Linux AppImage (x86_64)

on:
  push:
    branches: [windows, gpt]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0
      - name: Install GTK4/libadwaita build dependencies
        if: github.ref_name == 'gpt'
        run: |
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev \
            libgirepository-2.0-dev libcairo2-dev pkg-config gcc python3-dev
      - name: Install PyGObject in GTK variant
        if: github.ref_name == 'gpt'
        run: python -m pip install PyGObject
      - name: Install GitTool and PyInstaller
        run: |
          python -m pip install -e .
          python -m pip install --upgrade pyinstaller
      - name: Create Linux AppImage
        run: bash scripts/build_appimage.sh
      - name: Smoke test AppImage with a virtual display
        shell: bash
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a \
            dist/GitTool-*-x86_64.AppImage > build/smoke.log 2>&1
          code=$?
          set -e
          cat build/smoke.log
          if [ "$code" -ne 124 ]; then
            echo "GitTool AppImage exited before timeout: $code"
            exit 1
          fi
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GitTool-Linux-AppImage-${{ github.ref_name }}
          path: dist/GitTool-*-x86_64.AppImage
          if-no-files-found: error
