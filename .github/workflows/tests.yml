name: Tests

on:
  push:
    branches: [gpt]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Install GTK4/libadwaita development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gtk4 libadwaita-1-dev gir1.2-gtk-4.0 gir1.2-adw-1 libgirepository-2.0-dev libcairo2-dev pkg-config gcc
      - name: Install Python GTK bindings
        if: runner.os == 'Linux'
        run: python -m pip install PyGObject
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Test graphical window startup (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p test_gui.py -v
